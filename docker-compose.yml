services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: studio
      POSTGRES_USER: studio
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - storage_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studio -d studio"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    networks:
      - storage_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  encryption:
    build:
      context: .
      dockerfile: Dockerfile.encryption
      args:
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        NO_PROXY: ${NO_PROXY:-}
        PIP_PROXY: ${PIP_PROXY:-}
        PIP_TRUSTED_HOST: ${PIP_TRUSTED_HOST:-}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-}
        PIP_EXTRA_INDEX_URL: ${PIP_EXTRA_INDEX_URL:-}
    environment:
      ENCRYPTION_KEY_FILE: /var/lib/api-test-encryption/key
      ENCRYPTION_INITIAL_KEY: ${API_TEST_ENCRYPTION_KEY:-}
    volumes:
      - encryption_keys:/var/lib/api-test-encryption
    networks:
      - encryption_network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8766/health')"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
      args:
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        NO_PROXY: ${NO_PROXY:-}
        PIP_PROXY: ${PIP_PROXY:-}
        PIP_TRUSTED_HOST: ${PIP_TRUSTED_HOST:-}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-}
        PIP_EXTRA_INDEX_URL: ${PIP_EXTRA_INDEX_URL:-}
    env_file:
      - .env
    environment:
      API_TEST_HOST: 0.0.0.0
      API_TEST_PORT: "8765"
      EXAMPLE_PROJECT: ${EXAMPLE_PROJECT:-true}
      API_TEST_ENCRYPTION_URL: http://encryption:8766
      STUDIO_DB_PATH: /app/data/studio.db
      STUDIO_DATABASE_URL_FILE: /run/secrets/studio_database_url
      STUDIO_REDIS_URL: redis://redis:6379/0
      STUDIO_ENV: ${STUDIO_ENV:-local}
    secrets:
      - studio_database_url
    ports:
      - "${API_PORT:-8765}:8765"
    volumes:
      - "${CASE_VOLUME_PATH:-./case}:/app/case"
      - ./pipelines:/app/pipelines
      - "${LOG_VOLUME_PATH:-./logs}:/app/logs"
      - "${PROJECT_VOLUME_PATH:-./projects}:/app/projects"
      - "${DATA_VOLUME_PATH:-./data}:/app/data"
    networks:
      - app_network
      - encryption_network
      - storage_network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      encryption:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/api/cases')"]
      interval: 30s
      timeout: 3s
      retries: 10

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        NO_PROXY: ${NO_PROXY:-}
        NPM_PROXY: ${HTTP_PROXY:-}
        NPM_HTTPS_PROXY: ${HTTPS_PROXY:-}
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org/}
        NPM_STRICT_SSL: ${NPM_STRICT_SSL:-true}
    environment:
      VITE_HOST: 0.0.0.0
      VITE_API_PROXY_TARGET: http://api:8765
    ports:
      - "${WEB_PORT:-5173}:5173"
    volumes:
      - ./web:/app
      - web_node_modules:/app/node_modules
    networks:
      - app_network
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
  web_node_modules:
  encryption_keys:

networks:
  app_network:
  encryption_network:
    internal: true

  storage_network:
    internal: true

secrets:
  postgres_password:
    file: ${POSTGRES_PASSWORD_FILE:?Set path to PostgreSQL password secret outside the repository}
  studio_database_url:
    file: ${STUDIO_DATABASE_URL_FILE:?Set path to PostgreSQL connection URL secret outside the repository}
