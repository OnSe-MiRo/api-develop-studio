/api/interoperability/preview:
  post:
    operationId: interoperability_preview
    tags:
    - interoperability
    summary: Tool interoperability preview
    x-studio-handler: interoperability.preview
    x-studio-parts: '[]'
    x-studio-route: /api/interoperability/preview
    x-studio-upload: false
    x-studio-alias: false
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas/interoperability.yaml#/ImportRequest
    responses:
      '200':
        description: Success
        content:
          application/json:
            schema:
              $ref: ../components/schemas/interoperability.yaml#/ImportPreview
      '400':
        description: Invalid request
        content:
          application/json:
            schema:
              $ref: ../components/schemas/common.yaml#/ErrorResponse
      '404':
        description: Missing document
        content:
          application/json:
            schema:
              $ref: ../components/schemas/common.yaml#/ErrorResponse
      '409':
        description: Preview or revision conflict
        content:
          application/json:
            schema:
              $ref: ../components/schemas/common.yaml#/ErrorResponse
      '503':
        description: Storage unavailable
        content:
          application/json:
            schema:
              $ref: ../components/schemas/common.yaml#/ErrorResponse
