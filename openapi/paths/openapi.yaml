/api/projects/{reference}/openapi/operations:
  post:
    operationId: author_operation
    tags:
    - openapi
    summary: author operation
    responses:
      '200':
        description: Success
        content:
          application/json:
            schema:
              $ref: ../components/schemas/openapi.yaml#/AuthorOperationResponse
      '400':
        description: Invalid request
        content:
          application/json:
            schema:
              $ref: ../components/schemas/common.yaml#/ErrorResponse
      '403':
        description: Policy denied
        content:
          application/json:
            schema:
              $ref: ../components/schemas/common.yaml#/ErrorResponse
      '409':
        description: Revision conflict
        content:
          application/json:
            schema:
              $ref: ../components/schemas/common.yaml#/ErrorResponse
      '503':
        description: Storage unavailable
        content:
          application/json:
            schema:
              $ref: ../components/schemas/common.yaml#/ErrorResponse
    x-studio-handler: openapi.author_operation
    x-studio-parts: '[]'
    x-studio-route: /api/projects/{reference:path}/openapi/operations
    x-studio-upload: false
    x-studio-alias: true
    parameters:
    - name: reference
      in: path
      required: true
      schema:
        type: string
      description: Slash-separated document or attachment reference.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas/openapi.yaml#/AuthorOperationRequest
