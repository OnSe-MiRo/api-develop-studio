      '503':
        description: Storage unavailable
        content:
          application/json:
            schema:
              $ref: ../components/schemas/common.yaml#/ErrorResponse
    x-studio-handler: documents.list_revisions
    x-studio-parts: '[''cases'']'
    x-studio-route: /api/cases/{reference:path}/revisions
    x-studio-upload: false
