/api/cases:
  get:
    operationId: list_cases
    tags:
    - cases
    summary: list cases
    responses:
      '200':
        description: Success
        content:
          application/json:
            schema:
              $ref: ../components/schemas/common.yaml#/ReferenceList
      '400':
        description: Invalid request
        content:
          application/json:
            schema:
              $ref: ../components/schemas/common.yaml#/ErrorResponse
      '403':
        description: Policy denied
        content:
          application/json:
            schema:
              $ref: ../components/schemas/common.yaml#/ErrorResponse
      '409':
        description: Revision conflict
        content:
          application/json:
            schema:
              $ref: ../components/schemas/common.yaml#/ErrorResponse
      '503':
        description: Storage unavailable
        content:
          application/json:
            schema:
              $ref: ../components/schemas/common.yaml#/ErrorResponse
    x-studio-handler: documents.list_documents
    x-studio-parts: '[''cases'']'
    x-studio-route: /api/cases
    x-studio-upload: false
    x-studio-alias: true
    parameters:
    - name: project
      in: query
      required: false
      schema:
        type: string
/api/cases/{reference}/revisions:
