/api/oauth/callback/{providerKey}:
  get:
    operationId: complete_oauth_authorization
    tags:
    - oauth
    summary: complete oauth authorization
    responses:
      '303':
        description: Authorization completed; redirects to the trusted Studio project
          settings without code, state or provider details.
        headers:
          Location:
            schema:
              type: string
      '400':
        description: Invalid OAuth request or saved configuration
        content:
          application/json:
            schema:
              $ref: ../components/schemas/common.yaml#/ErrorResponse
      '403':
        description: Policy denied
        content:
          application/json:
            schema:
              $ref: ../components/schemas/common.yaml#/ErrorResponse
      '409':
        description: Authorization state, issuance ownership or refresh conflict;
          reconnect if required
        content:
          application/json:
            schema:
              $ref: ../components/schemas/common.yaml#/ErrorResponse
      '502':
        description: Sanitized provider or transport failure
        content:
          application/json:
            schema:
              $ref: ../components/schemas/common.yaml#/ErrorResponse
      '503':
        description: Storage unavailable
        content:
          application/json:
            schema:
              $ref: ../components/schemas/common.yaml#/ErrorResponse
      '504':
        description: OAuth endpoint timeout
        content:
          application/json:
            schema:
              $ref: ../components/schemas/common.yaml#/ErrorResponse
    x-studio-handler: oauth.callback
    x-studio-parts: '[]'
    x-studio-route: /api/oauth/callback/{providerKey}
    x-studio-upload: false
    x-studio-alias: false
    parameters:
    - name: providerKey
      in: path
      required: true
      schema:
        type: string
        pattern: ^[a-f0-9]{24}$
    - name: state
      in: query
      required: true
      schema:
        type: string
    - name: code
      in: query
      required: false
      schema:
        type: string
    - name: error
      in: query
      required: false
      schema:
        type: string
    - name: iss
      in: query
      required: false
      schema:
        type: string
