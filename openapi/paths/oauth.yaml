/api/projects/{reference}/oauth/profiles/{profile}:
  get:
    operationId: get_oauth_profile_status
    tags:
    - oauth
    summary: get oauth profile status
    responses:
      '200':
        description: Success
        content:
          application/json:
            schema:
              $ref: ../components/schemas/oauth.yaml#/OAuthProfileStatus
      '400':
        description: Invalid OAuth request or saved configuration
        content:
          application/json:
            schema:
              $ref: ../components/schemas/common.yaml#/ErrorResponse
      '403':
        description: Policy denied
        content:
          application/json:
            schema:
              $ref: ../components/schemas/common.yaml#/ErrorResponse
      '409':
        description: Authorization state, issuance ownership or refresh conflict;
          reconnect if required
        content:
          application/json:
            schema:
              $ref: ../components/schemas/common.yaml#/ErrorResponse
      '502':
        description: Sanitized provider or transport failure
        content:
          application/json:
            schema:
              $ref: ../components/schemas/common.yaml#/ErrorResponse
      '503':
        description: Storage unavailable
        content:
          application/json:
            schema:
              $ref: ../components/schemas/common.yaml#/ErrorResponse
      '504':
        description: OAuth endpoint timeout
        content:
          application/json:
            schema:
              $ref: ../components/schemas/common.yaml#/ErrorResponse
    x-studio-handler: oauth.profile_status
    x-studio-parts: '[]'
    x-studio-route: /api/projects/{reference:path}/oauth/profiles/{profile}
    x-studio-upload: false
    x-studio-alias: false
    parameters:
    - name: reference
      in: path
      required: true
      schema:
        type: string
    - name: profile
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
    - name: environment
      in: query
      required: false
      schema:
        type: string
        maxLength: 128
      description: Saved environment; omitted selects project-common configuration.
  delete:
    operationId: disconnect_oauth_profile
    tags:
    - oauth
    summary: disconnect oauth profile
    responses:
      '200':
        description: Success
        content:
          application/json:
            schema:
              $ref: ../components/schemas/oauth.yaml#/OAuthProfileStatus
      '400':
        description: Invalid OAuth request or saved configuration
        content:
          application/json:
            schema:
              $ref: ../components/schemas/common.yaml#/ErrorResponse
      '403':
        description: Policy denied
        content:
          application/json:
            schema:
              $ref: ../components/schemas/common.yaml#/ErrorResponse
      '409':
        description: Authorization state, issuance ownership or refresh conflict;
          reconnect if required
        content:
          application/json:
            schema:
              $ref: ../components/schemas/common.yaml#/ErrorResponse
      '502':
        description: Sanitized provider or transport failure
        content:
          application/json:
            schema:
              $ref: ../components/schemas/common.yaml#/ErrorResponse
      '503':
        description: Storage unavailable
        content:
          application/json:
            schema:
              $ref: ../components/schemas/common.yaml#/ErrorResponse
      '504':
        description: OAuth endpoint timeout
        content:
          application/json:
            schema:
              $ref: ../components/schemas/common.yaml#/ErrorResponse
    x-studio-handler: oauth.disconnect
    x-studio-parts: '[]'
    x-studio-route: /api/projects/{reference:path}/oauth/profiles/{profile}
    x-studio-upload: false
    x-studio-alias: false
    parameters:
    - name: reference
      in: path
      required: true
      schema:
        type: string
    - name: profile
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
    - name: environment
      in: query
      required: false
      schema:
        type: string
        maxLength: 128
      description: Saved environment; omitted selects project-common configuration.
