/example-api:
  get:
    operationId: get_example
    tags:
    - example
    summary: get example
    responses:
      '200':
        description: Success
        content:
          application/json:
            schema:
              $ref: ../components/schemas/example.yaml#/ExampleResponse
      '400':
        description: Invalid request
        content:
          application/json:
            schema:
              $ref: ../components/schemas/common.yaml#/ErrorResponse
      '403':
        description: Policy denied
        content:
          application/json:
            schema:
              $ref: ../components/schemas/common.yaml#/ErrorResponse
      '409':
        description: Revision conflict
        content:
          application/json:
            schema:
              $ref: ../components/schemas/common.yaml#/ErrorResponse
      '503':
        description: Storage unavailable
        content:
          application/json:
            schema:
              $ref: ../components/schemas/common.yaml#/ErrorResponse
      '201':
        description: Example user created
        content:
          application/json:
            schema:
              $ref: ../components/schemas/example.yaml#/ExampleResponse
      '401':
        description: Missing or invalid example API key
        content:
          application/json:
            schema:
              $ref: ../components/schemas/example.yaml#/ExampleResponse
      '404':
        description: Example endpoint not found
        content:
          application/json:
            schema:
              $ref: ../components/schemas/example.yaml#/ExampleResponse
    x-studio-handler: example.handle_example
    x-studio-parts: '[]'
    x-studio-route: /example-api
    x-studio-upload: false
    x-studio-alias: true
  post:
