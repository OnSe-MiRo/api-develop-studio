/api/projects/{reference}/releases:
  get:
    operationId: list_releases
    tags:
    - releases
    summary: list releases
    x-studio-handler: releases.list_releases
    x-studio-parts: '[]'
    x-studio-route: /api/projects/{reference:path}/releases
    x-studio-upload: false
    x-studio-alias: false
    parameters:
    - name: reference
      in: path
      required: true
      schema:
        type: string
    - name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    - name: before
      in: query
      schema:
        type: string
    responses:
      '200':
        description: Success
        content:
          application/json:
            schema:
              $ref: ../components/schemas/releases.yaml#/ApiReleaseList
      '400':
        description: Invalid request
        content:
          application/json:
            schema:
              $ref: ../components/schemas/common.yaml#/ErrorResponse
      '403':
        description: Role denied
        content:
          application/json:
            schema:
              $ref: ../components/schemas/common.yaml#/ErrorResponse
      '404':
        description: Not found
        content:
          application/json:
            schema:
              $ref: ../components/schemas/common.yaml#/ErrorResponse
      '409':
        description: Revision or state conflict
        content:
          application/json:
            schema:
              $ref: ../components/schemas/common.yaml#/ErrorResponse
      '503':
        description: Storage unavailable
        content:
          application/json:
            schema:
              $ref: ../components/schemas/common.yaml#/ErrorResponse
  post:
    operationId: create_release
    tags:
    - releases
    summary: create release
    x-studio-handler: releases.create_release
    x-studio-parts: '[]'
    x-studio-route: /api/projects/{reference:path}/releases
    x-studio-upload: false
    x-studio-alias: false
    parameters:
    - name: reference
      in: path
      required: true
      schema:
        type: string
    responses:
      '201':
        description: Success
        content:
          application/json:
            schema:
              $ref: ../components/schemas/releases.yaml#/ApiRelease
      '400':
        description: Invalid request
        content:
          application/json:
            schema:
              $ref: ../components/schemas/common.yaml#/ErrorResponse
      '403':
        description: Role denied
        content:
          application/json:
            schema:
              $ref: ../components/schemas/common.yaml#/ErrorResponse
      '404':
        description: Not found
        content:
          application/json:
            schema:
              $ref: ../components/schemas/common.yaml#/ErrorResponse
      '409':
        description: Revision or state conflict
        content:
          application/json:
            schema:
              $ref: ../components/schemas/common.yaml#/ErrorResponse
      '503':
        description: Storage unavailable
        content:
          application/json:
            schema:
              $ref: ../components/schemas/common.yaml#/ErrorResponse
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas/releases.yaml#/ReleaseCreateRequest
