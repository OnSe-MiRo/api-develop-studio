/api/dashboard:
  get:
    operationId: get_dashboard
    tags:
    - dashboard
    summary: get dashboard
    responses:
      '200':
        description: Success
        content:
          application/json:
            schema:
              $ref: ../components/schemas/dashboard.yaml#/DashboardResponse
      '400':
        description: Invalid request
        content:
          application/json:
            schema:
              $ref: ../components/schemas/common.yaml#/ErrorResponse
      '403':
        description: Policy denied
        content:
          application/json:
            schema:
              $ref: ../components/schemas/common.yaml#/ErrorResponse
      '409':
        description: Revision conflict
        content:
          application/json:
            schema:
              $ref: ../components/schemas/common.yaml#/ErrorResponse
      '503':
        description: Storage unavailable
        content:
          application/json:
            schema:
              $ref: ../components/schemas/common.yaml#/ErrorResponse
    x-studio-handler: dashboard.get_dashboard
    x-studio-parts: '[]'
    x-studio-route: /api/dashboard
    x-studio-upload: false
    x-studio-alias: true
    parameters:
    - name: project
      in: query
      required: false
      schema:
        type: string
    - name: days
      in: query
      required: false
      schema:
        type: string
    - name: status
      in: query
      required: false
      schema:
        type: string
    - name: page
      in: query
      required: false
      schema:
        type: string
