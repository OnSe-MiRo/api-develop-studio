/api/projects/{reference}/portal:
  get:
    operationId: list_portal_releases
    tags:
    - portal
    summary: list portal releases
    x-studio-handler: portal.list_portal_releases
    x-studio-parts: '[]'
    x-studio-route: /api/projects/{reference:path}/portal
    x-studio-upload: false
    x-studio-alias: false
    parameters:
    - name: reference
      in: path
      required: true
      schema:
        type: string
    - name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    - name: before
      in: query
      schema:
        type: string
    responses:
      '200':
        description: Success
        content:
          application/json:
            schema:
              $ref: ../components/schemas/releases.yaml#/ApiReleaseList
      '400':
        description: Invalid request
        content:
          application/json:
            schema:
              $ref: ../components/schemas/common.yaml#/ErrorResponse
      '403':
        description: Role denied
        content:
          application/json:
            schema:
              $ref: ../components/schemas/common.yaml#/ErrorResponse
      '404':
        description: Not found
        content:
          application/json:
            schema:
              $ref: ../components/schemas/common.yaml#/ErrorResponse
      '409':
        description: Release or artifact conflict
        content:
          application/json:
            schema:
              $ref: ../components/schemas/common.yaml#/ErrorResponse
      '429':
        description: Capacity exceeded
        content:
          application/json:
            schema:
              $ref: ../components/schemas/common.yaml#/ErrorResponse
      '503':
        description: Storage unavailable
        content:
          application/json:
            schema:
              $ref: ../components/schemas/common.yaml#/ErrorResponse
