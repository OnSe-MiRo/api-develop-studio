          application/json:
            schema:
              $ref: ../components/schemas/common.yaml#/ErrorResponse
      '409':
        description: Revision conflict
        content:
          application/json:
            schema:
              $ref: ../components/schemas/common.yaml#/ErrorResponse
      '503':
        description: Storage unavailable
        content:
          application/json:
            schema:
              $ref: ../components/schemas/common.yaml#/ErrorResponse
    x-studio-handler: documents.list_revisions
    x-studio-parts: '[''projects'']'
    x-studio-route: /api/projects/{reference:path}/revisions
    x-studio-upload: false
    x-studio-alias: true
    parameters:
    - name: reference
      in: path
      required: true
      schema:
        type: string
      description: Slash-separated document or attachment reference.
