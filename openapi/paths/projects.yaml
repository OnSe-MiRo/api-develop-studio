/api/projects:
  get:
    operationId: list_projects
    tags:
    - projects
    summary: list projects
    responses:
      '200':
        description: Success
        content:
          application/json:
            schema:
              $ref: ../components/schemas/common.yaml#/ReferenceList
      '400':
        description: Invalid request
        content:
          application/json:
            schema:
              $ref: ../components/schemas/common.yaml#/ErrorResponse
      '403':
        description: Policy denied
        content:
          application/json:
            schema:
              $ref: ../components/schemas/common.yaml#/ErrorResponse
      '409':
        description: Revision conflict
        content:
          application/json:
            schema:
              $ref: ../components/schemas/common.yaml#/ErrorResponse
      '503':
        description: Storage unavailable
        content:
          application/json:
            schema:
              $ref: ../components/schemas/common.yaml#/ErrorResponse
    x-studio-handler: documents.list_documents
    x-studio-parts: '[''projects'']'
    x-studio-route: /api/projects
    x-studio-upload: false
    x-studio-alias: true
    parameters:
    - name: project
      in: query
      required: false
      schema:
        type: string
/api/projects/{reference}/revisions:
  get:
    operationId: list_projects_revisions
    tags:
    - projects
    summary: list projects revisions
    responses:
      '200':
        description: Success
        content:
          application/json:
            schema:
              $ref: ../components/schemas/common.yaml#/RevisionList
      '400':
        description: Invalid request
        content:
          application/json:
            schema:
              $ref: ../components/schemas/common.yaml#/ErrorResponse
      '403':
        description: Policy denied
