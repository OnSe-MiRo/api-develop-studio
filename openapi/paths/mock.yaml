/api/projects/{reference}/mock:
  get:
    operationId: get_mock_status
    tags:
    - mock
    summary: Get mock server status and configuration
    parameters:
    - name: reference
      in: path
      required: true
      schema:
        type: string
    responses:
      '200':
        description: Mock server status
        content:
          application/json:
            schema:
              $ref: ../components/schemas/mock.yaml#/MockStatusResponse
      '400':
        description: Invalid request
        content:
          application/json:
            schema:
              $ref: ../components/schemas/common.yaml#/ErrorResponse
      '404':
        description: Project not found
        content:
          application/json:
            schema:
              $ref: ../components/schemas/common.yaml#/ErrorResponse
    x-studio-handler: mock.get_status
    x-studio-parts: '[]'
    x-studio-route: /api/projects/{reference:path}/mock
    x-studio-upload: false
    x-studio-alias: true

/api/projects/{reference}/mock/start:
  post:
    operationId: start_mock_server
    tags:
    - mock
    summary: Start mock server for project
    parameters:
    - name: reference
      in: path
      required: true
      schema:
        type: string
    requestBody:
      required: false
      content:
        application/json:
          schema:
            $ref: ../components/schemas/mock.yaml#/MockStartRequest
    responses:
      '200':
        description: Mock server started
        content:
          application/json:
            schema:
              $ref: ../components/schemas/mock.yaml#/MockStatusResponse
      '400':
        description: Invalid request or port conflict
        content:
          application/json:
            schema:
              $ref: ../components/schemas/common.yaml#/ErrorResponse
      '404':
        description: Project not found
        content:
          application/json:
            schema:
              $ref: ../components/schemas/common.yaml#/ErrorResponse
    x-studio-handler: mock.start_server
    x-studio-parts: '[]'
    x-studio-route: /api/projects/{reference:path}/mock/start
    x-studio-upload: false
    x-studio-alias: true

