/api/pipelines:
  get:
    operationId: list_pipelines
    tags:
    - pipelines
    summary: list pipelines
    responses:
      '200':
        description: Success
        content:
          application/json:
            schema:
              $ref: ../components/schemas/common.yaml#/ReferenceList
      '400':
        description: Invalid request
        content:
          application/json:
            schema:
              $ref: ../components/schemas/common.yaml#/ErrorResponse
      '403':
        description: Policy denied
        content:
          application/json:
            schema:
              $ref: ../components/schemas/common.yaml#/ErrorResponse
      '409':
        description: Revision conflict
        content:
          application/json:
            schema:
              $ref: ../components/schemas/common.yaml#/ErrorResponse
      '503':
        description: Storage unavailable
        content:
          application/json:
            schema:
              $ref: ../components/schemas/common.yaml#/ErrorResponse
    x-studio-handler: documents.list_documents
    x-studio-parts: '[''pipelines'']'
    x-studio-route: /api/pipelines
    x-studio-upload: false
    x-studio-alias: true
    parameters:
    - name: project
      in: query
      required: false
      schema:
        type: string
