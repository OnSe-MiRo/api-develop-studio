PipelineStep:
  type: object
  properties:
    name:
      type: string
    case:
      type: string
    phase:
      type: string
      enum: [setup, test, teardown]
    extract:
      type: object
      additionalProperties:
        type: string
    retry:
      type: integer
    retry_interval_seconds:
      type: number
    external_once:
      type: boolean
    continue_on_failure:
      type: boolean
    input_mappings:
      type: array
      items:
        type: object
        additionalProperties: true
  required:
  - name
  - case
PipelineDocument:
  type: object
  properties:
    name:
      type: string
    project:
      type: string
    steps:
      type: array
      items:
        $ref: '#/PipelineStep'
    seed:
      description: Fixed integer or string seed; omitted means random values
    generators:
      type: object
      additionalProperties:
        type: object
        additionalProperties: true
    defaults:
      type: object
      additionalProperties: true
    _storage:
      $ref: ./common.yaml#/StorageMetadata
