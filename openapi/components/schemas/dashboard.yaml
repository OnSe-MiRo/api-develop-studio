DashboardResponse:
  type: object
  properties:
    summary:
      type: object
    trend:
      type: array
      items:
        type: object
    items:
      type: array
      items:
        type: object
    total:
      type: integer
    page:
      type: integer
    pageSize:
      type: integer
ExecutionDetail:
  type: object
  required: [runId, status, targets, detail]
  properties:
    runId:
      type: string
    status:
      type: string
    targets:
      type: array
      items:
        type: object
    detail:
      type: object
      nullable: true
    rerunRequest:
      type: object
      nullable: true
