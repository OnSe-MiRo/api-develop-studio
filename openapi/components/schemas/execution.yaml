QuickRequest:
  type: object
  properties:
    contractDocumentUrl:
      type: string
      minLength: 1
      maxLength: 2048
      description: Absolute HTTP(S) location of the OpenAPI document for resolving relative servers. No credentials, query or fragment. Never fetched; requires validateContract=true and does not change the request URL.
    serverVariables:
      type: object
      maxProperties: 32
      additionalProperties:
        type: string
        maxLength: 512
      description: Explicit OpenAPI server variable values for response matching only. Requires validateContract=true; keys are 1-128 characters. Does not modify the request URL.
    validateContract:
      type: boolean
      default: false
    project:
      type: string
    environment:
      type: string
    method:
      type: string
    url:
      type: string
    params: {}
    headers: {}
    auth:
      type: object
      additionalProperties: true
    auth_profile:
      type: string
    body: {}
    body_format:
      type: string
    text:
      type: string
    form_data:
      type: array
      items:
        $ref: ./cases.yaml#/FormDataItem
    proxy_url:
      type: string
    no_proxy:
      type: boolean
    timeout:
      type: number
  required:
  - url
QuickResponse:
  type: object
  properties:
    contract:
      type: object
      additionalProperties: true
    status:
      type: integer
    elapsedMs:
      type: number
    sizeBytes:
      type: integer
    headers:
      type: object
      additionalProperties:
        type: string
    body: {}
    rawBody:
      type: string
  required:
  - status
  - elapsedMs
  - sizeBytes
  - headers
  - rawBody
RunRequest:
  type: object
  properties:
    cases:
      type: array
      items:
        type: string
    pipelines:
      type: array
      items:
        type: string
    inlineCase:
      $ref: ./cases.yaml#/CaseInput
    inlinePipeline:
      $ref: ./pipelines.yaml#/PipelineDocument
    caseReference:
      type: string
    environment:
      type: string
RunResponse:
  type: object
  properties:
    runId:
      type: string
    exitCode:
      type: integer
    output:
      type: string
    result:
      type: object
      description: Version 1 sanitized execution report with run metadata and per-case
        assertions.
      additionalProperties: true
    historyWarning:
      type: string
  required:
  - runId
RunJob:
  type: object
  required:
  - runId
  - status
  - createdAt
  properties:
    kind:
      type: string
      description: SDK generation jobs use sdk_generation; existing functional run fields remain unchanged.
    generation:
      $ref: ./sdk-generation.yaml#/SdkGenerationMetadata
    runId:
      type: string
    status:
      type: string
      enum:
      - queued
      - running
      - cancelling
      - passed
      - failed
      - error
      - timeout
      - cancelled
    createdAt:
      type: string
    startedAt:
      type: string
      nullable: true
    finishedAt:
      type: string
      nullable: true
    exitCode:
      type: integer
      nullable: true
    result:
      type: object
      nullable: true
      additionalProperties: true
    output:
      type: string
    error:
      type: string
    historyWarning:
      type: string
    release:
      type: object
      additionalProperties: true
