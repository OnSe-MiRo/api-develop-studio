DocsRequest:
  type: object
  properties:
    url:
      type: string
    document:
      type: object
      additionalProperties: true
    bundle:
      $ref: ./common.yaml#/DocumentBundle
    no_proxy:
      type: boolean
    for_case:
      type: boolean
DocsResponse:
  type: object
  properties:
    operations:
      type: array
      items:
        type: object
        additionalProperties: true
  required:
  - operations
GenerateRequest:
  type: object
  properties:
    project:
      type: string
    language:
      type: string
  required:
  - project
  - language
AuthorOperationRequest:
  type: object
  properties:
    action:
      type: string
      enum: [create, update, delete]
      default: create
    changes:
      type: object
      description: Operation metadata patch for update; only operationId, summary, description, tags, deprecated.
      additionalProperties: true
    method:
      type: string
    path:
      type: string
    operation_id:
      type: string
    summary:
      type: string
    tag:
      type: string
    parameters:
      type: array
      items:
        type: object
        additionalProperties: true
    has_request_body:
      type: boolean
    request_body: {}
    request_body_required:
      type: boolean
    response_status:
      type: integer
    response_description:
      type: string
    has_response_body:
      type: boolean
    response_body: {}
    error_statuses:
      type: array
      items:
        type: integer
    _storage:
      $ref: ./common.yaml#/StorageMetadata
AuthorOperationResponse:
  type: object
  properties:
    operation:
      type: object
      additionalProperties: true
    _storage:
      $ref: ./common.yaml#/StorageMetadata

ContractCheckRequest:
  type: object
  properties:
    baselineRevision:
      type: integer
      minimum: 1
ContractCheckResponse:
  type: object
  properties:
    compatible:
      type: boolean
    currentRevision:
      type: integer
    baselineRevision:
      type: integer
      nullable: true
    issues:
      type: array
      items:
        type: object
        additionalProperties: true
    changes:
      type: array
      items:
        type: object
        additionalProperties: true


OpenApiEditorSource:
  type: object
  description: Raw owner documents. Bundle rawFiles text is authoritative for exact export and import.
  properties:
    kind:
      type: string
      enum: [file, bundle]
    entrypoint:
      type: string
    files:
      type: object
      additionalProperties: true
    rawFiles:
      type: object
      additionalProperties:
        type: string
  required: [kind, entrypoint]
OpenApiEditorEdit:
  type: object
  properties:
    file:
      type: string
    op:
      type: string
      enum: [add, replace, remove]
    path:
      type: string
      description: JSON Pointer in the raw owner file, starting with '#/'.
    value: {}
  required: [file, op, path]
OpenApiEditorRequest:
  type: object
  properties:
    action:
      type: string
      enum: [preview, apply]
    sourceDigest:
      type: string
      minLength: 64
      maxLength: 64
    _storage:
      $ref: ./common.yaml#/StorageMetadata
    edits:
      type: array
      items:
        $ref: '#/OpenApiEditorEdit'
    source:
      $ref: '#/OpenApiEditorSource'
  required: [action, sourceDigest, _storage]
OpenApiEditorResponse:
  type: object
  properties:
    valid:
      type: boolean
    issues:
      type: array
      items:
        type: object
        additionalProperties: true
    changedFiles:
      type: array
      items:
        type: string
    affectedOperations:
      type: array
      items:
        type: object
        additionalProperties: true
    catalog:
      type: object
      additionalProperties: true
    source:
      $ref: '#/OpenApiEditorSource'
    sourceDigest:
      type: string
    nextSourceDigest:
      type: string
    _storage:
      $ref: ./common.yaml#/StorageMetadata
  required: [source, sourceDigest, _storage]
