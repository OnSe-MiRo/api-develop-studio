DocsRequest:
  type: object
  properties:
    url:
      type: string
    document:
      type: object
      additionalProperties: true
    bundle:
      $ref: ./common.yaml#/DocumentBundle
    no_proxy:
      type: boolean
    for_case:
      type: boolean
DocsResponse:
  type: object
  properties:
    operations:
      type: array
      items:
        type: object
        additionalProperties: true
  required:
  - operations
GenerateRequest:
  type: object
  properties:
    project:
      type: string
    language:
      type: string
  required:
  - project
  - language
AuthorOperationRequest:
  type: object
  properties:
    action:
      type: string
      enum: [create, update, delete]
      default: create
    changes:
      type: object
      description: Operation metadata patch for update; only operationId, summary, description, tags, deprecated.
      additionalProperties: true
    method:
      type: string
    path:
      type: string
    operation_id:
      type: string
    summary:
      type: string
    tag:
      type: string
    parameters:
      type: array
      items:
        type: object
        additionalProperties: true
    has_request_body:
      type: boolean
    request_body: {}
    request_body_required:
      type: boolean
    response_status:
      type: integer
    response_description:
      type: string
    has_response_body:
      type: boolean
    response_body: {}
    error_statuses:
      type: array
      items:
        type: integer
    _storage:
      $ref: ./common.yaml#/StorageMetadata
AuthorOperationResponse:
  type: object
  properties:
    operation:
      type: object
      additionalProperties: true
    _storage:
      $ref: ./common.yaml#/StorageMetadata

ContractCheckRequest:
  type: object
  properties:
    baselineRevision:
      type: integer
      minimum: 1
ContractCheckResponse:
  type: object
  properties:
    compatible:
      type: boolean
    currentRevision:
      type: integer
    baselineRevision:
      type: integer
      nullable: true
    issues:
      type: array
      items:
        type: object
        additionalProperties: true
    changes:
      type: array
      items:
        type: object
        additionalProperties: true
