name: OpenAPI compatibility
on:
  pull_request:
    paths:
      - 'openapi/**'
      - 'api_test/contracts/**'
      - 'requirements.txt'
      - '.openapi-contract-approvals.json'
      - '.github/workflows/openapi-compatibility.yml'
permissions:
  contents: read
jobs:
  compatibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements.txt
      - name: Compare immutable PR base with current contract
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          baseline_dir="$(mktemp -d)"
          git archive "$BASE_SHA" openapi | tar -x -C "$baseline_dir"
          approval_args=()
          if [ -f .openapi-contract-approvals.json ]; then
            approval_args=(--approvals .openapi-contract-approvals.json)
          fi
          python -m api_test.contracts openapi/studio.yaml --baseline "$baseline_dir/openapi/studio.yaml" "${approval_args[@]}" --output contract-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: openapi-contract-report
          path: contract-report.json
